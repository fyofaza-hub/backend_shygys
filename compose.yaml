services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: shygys
      POSTGRES_DB: shygys
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shygys"]
      interval: 5s
      timeout: 3s
      retries: 12
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
    volumes:
      - media:/data
    ports:
      - "127.0.0.1:9001:9001"
  mail:
    image: ghcr.io/axllent/mailpit:v1.27.4
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mail:/data
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
  clamav:
    image: clamav/clamav:1.4
    profiles: ["antivirus"]
    volumes:
      - clamav:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 30s
      timeout: 10s
      retries: 20
  bucket:
    build: .
    env_file: .env
    command: ["python", "-m", "scripts.init_bucket"]
    depends_on:
      minio:
        condition: service_started
  migrate:
    build: .
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    env_file: .env
    environment:
      S3_ENDPOINT: http://minio:9000
      SMTP_HOST: mail
      SMTP_PORT: 1025
      SMTP_STARTTLS: "false"
      CLAMAV_HOST: clamav
      ENABLE_CLAMAV: ${ENABLE_CLAMAV:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully
      bucket:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
  worker:
    build: .
    env_file: .env
    environment:
      S3_ENDPOINT: http://minio:9000
      SMTP_HOST: mail
      SMTP_PORT: 1025
      SMTP_STARTTLS: "false"
      CLAMAV_HOST: clamav
      ENABLE_CLAMAV: ${ENABLE_CLAMAV:-false}
    command: ["arq", "app.worker.WorkerSettings"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      bucket:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
volumes:
  db:
  redis:
  media:
  mail:
  clamav:
