[project]
name = "creative-shygys"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "alembic>=1.15,<2",
  "redis>=5,<6",
  "arq>=0.26,<1",
  "PyJWT>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1",
  "email-validator>=2,<3",
  "python-multipart>=0.0.20,<1",
  "boto3>=1.37,<2",
  "Pillow>=11,<14",
  "httpx>=0.28,<1",
  "openpyxl>=3.1,<4",
  "qrcode[pil]>=8,<9",
]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "openapi-spec-validator>=0.7,<1"]
[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
markers = ["integration: tests requiring disposable PostGIS and Redis instances"]
